<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMU — Mapa de conexiones</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:Inter,Arial,sans-serif}
#map{width:100%;height:100%;touch-action:none;cursor:grab}#map.dragging{cursor:grabbing}#svgMap{width:100%;height:100%;user-select:none}
.person-node{cursor:pointer;transition:opacity .22s}.person-node.dimmed{opacity:.08}.person-node.related{opacity:1}.person-node.selected circle{stroke-width:3.5}.graph-edge{transition:opacity .22s}.graph-edge.dimmed{opacity:.03}.graph-edge.related{opacity:.85}.person-node.dragging{cursor:grabbing}
.main-nav{position:fixed;top:92px;left:78px;z-index:20}.main-nav button{height:38px;border:1px solid #292929;background:rgba(7,7,7,.92);color:#bbb;padding:0 15px;font-size:10px;letter-spacing:1.5px;cursor:pointer}.main-nav button:hover{color:#fff;background:#151515}.controls{position:fixed;top:92px;left:24px;display:flex;flex-direction:column;gap:5px;z-index:20}.controls button{width:38px;height:38px;border:1px solid #292929;background:rgba(7,7,7,.92);color:#bbb;font-size:17px;cursor:pointer}.controls button:hover{background:#161616;color:#fff}.zoom-level{color:#555;font-size:9px;text-align:center;padding:4px}.nexus{position:fixed;top:92px;right:24px;border:1px solid #1f4f70;background:rgba(5,5,5,.94);padding:15px 18px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}.nexus i{width:13px;height:13px;border-radius:50%;background:#28a7ff;display:inline-block;box-shadow:0 0 10px rgba(40,167,255,.6)}.legend{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(1050px,94vw);padding:14px 18px;border-top:1px solid #222;background:rgba(5,5,5,.94);display:flex;flex-wrap:wrap;justify-content:center;gap:13px 22px;font-size:11px;color:#999}.legend-title{color:#555;letter-spacing:2px;margin-right:5px}.legend span{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.legend span i{width:10px;height:10px;border-radius:50%;display:inline-block}.panel{position:fixed;right:0;top:0;width:min(360px,90vw);height:100%;background:#0c0c0c;border-left:1px solid #222;padding:55px 25px;transform:translateX(100%);transition:.3s;overflow:auto;z-index:30}.panel.open{transform:translateX(0)}.close{position:absolute;right:18px;top:12px;background:none;border:0;color:#777;font-size:26px}h2{font-size:32px;margin:5px 0 20px}.muted{color:#666;font-size:10px;letter-spacing:2px}.row{padding:10px 0;border-bottom:1px solid #191919;font-size:12px;display:flex;justify-content:space-between;gap:10px}.story{color:#aaa;line-height:1.6;margin:20px 0}@media(max-width:700px){.nexus{right:12px;top:12px;font-size:11px}.controls{left:12px;top:12px}.legend{bottom:6px;font-size:9px;gap:9px 13px}}
</style></head><body>
<div id="map"><div class="main-nav"><button id="statsPageBtn" type="button">ESTADÍSTIQUES <span>↗</span></button></div>
