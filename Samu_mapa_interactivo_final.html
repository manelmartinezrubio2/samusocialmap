const people=new Map(DATA.people.map(p=>[String(p.ID),p]));
const refs=new Map(DATA.references.map(r=>[String(r.ID),r]));
const svg=document.getElementById('svgMap'), viewport=document.getElementById('viewport'), map=document.getElementById('map');
let scale=1, tx=0, ty=0, draggingCanvas=false, startX=0,startY=0, startTx=0,startTy=0;
let nodeDrag=null;
function applyTransform(){viewport.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);document.getElementById('zoomText').textContent=Math.round(scale*100)+'%';}
function zoomAt(factor,cx,cy){
 const ns=Math.max(.35,Math.min(3.2,scale*factor));
 const k=ns/scale; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=ns; applyTransform();
}
function resetView(){scale=1;tx=0;ty=0;applyTransform()}
document.getElementById('statsPageBtn').addEventListener('click',()=>window.location.href='Samu_estadisticas.html');
document.getElementById('zoomIn').addEventListener('click',()=>zoomAt(1.2,600,410));
document.getElementById('zoomOut').addEventListener('click',()=>zoomAt(.8333,600,410));
document.getElementById('reset').addEventListener('click',resetView);
map.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*1200,y=(e.clientY-r.top)/r.height*820;zoomAt(e.deltaY<0?1.12:.89,x,y)},{passive:false});
map.addEventListener('click',e=>{
 if(!e.target.closest('.person-node') && !e.target.closest('.controls') && !e.target.closest('.panel')) clearSelection();
});
map.addEventListener('pointerdown',e=>{
 if(e.target.closest('.person-node')) return;
 draggingCanvas=true;map.classList.add('dragging');map.setPointerCapture(e.pointerId);startX=e.clientX;startY=e.clientY;startTx=tx;startTy=ty;
});
map.addEventListener('pointermove',e=>{if(!draggingCanvas)return;tx=startTx+(e.clientX-startX)*1200/svg.clientWidth;ty=startTy+(e.clientY-startY)*820/svg.clientHeight;applyTransform()});
map.addEventListener('pointerup',()=>{draggingCanvas=false;map.classList.remove('dragging')});
map.addEventListener('pointercancel',()=>{draggingCanvas=false;map.classList.remove('dragging')});
document.querySelectorAll('.person-node').forEach(node=>{
 node.addEventListener('pointerdown',e=>{
   e.stopPropagation();nodeDrag={node,startX:e.clientX,startY:e.clientY,orig:node.getAttribute('transform'),moved:false};node.setPointerCapture(e.pointerId);
 });
 node.addEventListener('pointermove',e=>{
   if(!nodeDrag||nodeDrag.node!==node)return;
   const dx=(e.clientX-nodeDrag.startX)*1200/svg.clientWidth/scale;
   const dy=(e.clientY-nodeDrag.startY)*820/svg.clientHeight/scale;
   if(Math.abs(dx)+Math.abs(dy)>4)nodeDrag.moved=true;
   const m=nodeDrag.orig.match(/translate\(([-\d.]+) ([-\d.]+)\)/);
   if(m)node.setAttribute('transform',`translate(${+m[1]+dx} ${+m[2]+dy})`);
 });
 node.addEventListener('pointerup',e=>{
   if(!nodeDrag||nodeDrag.node!==node)return;
   const moved=nodeDrag.moved;nodeDrag=null;
   if(!moved)openPanel(node.dataset.id);
 });
});

let selectedId=null;
function clearSelection(){
 selectedId=null;
 document.querySelectorAll('.person-node').forEach(n=>n.classList.remove('dimmed','related','selected'));
 document.querySelectorAll('.graph-edge').forEach(e=>e.classList.remove('dimmed','related'));
}
function selectNetwork(id){
 selectedId=String(id);
 const connected=new Set([selectedId]);
 DATA.connections.forEach(c=>{
   const a=String(c['ID A']),b=String(c['ID B']);
   if(a===selectedId) connected.add(b);
   if(b===selectedId) connected.add(a);
 });
 document.querySelectorAll('.person-node').forEach(n=>{
   const nid=String(n.dataset.id);
   n.classList.toggle('dimmed',!connected.has(nid));
   n.classList.toggle('related',connected.has(nid));
   n.classList.toggle('selected',nid===selectedId);
 });
 document.querySelectorAll('.graph-edge').forEach(e=>{
   const related=e.classList.contains('central-edge')
     ? String(e.dataset.target)===selectedId
     : (String(e.dataset.a)===selectedId || String(e.dataset.b)===selectedId);
   e.classList.toggle('dimmed',!related);
   e.classList.toggle('related',related);
 });
}
function openPanel(id){selectNetwork(id);
 const p=people.get(String(id)),r=refs.get(String(id));
 const con=DATA.connections.filter(c=>String(c['ID A'])===String(id)||String(c['ID B'])===String(id));
 let h='<div class="muted">REFERENCIA '+String(p.ID).padStart(2,'0')+'</div><h2>'+p.Nombre+'</h2>';
 h+='<div class="row"><span>CUÁNDO</span><b>'+p['Hace cuánto conoció a Samu']+'</b></div><div class="row"><span>FECHA</span><b>'+p['Fecha aprox.']+'</b></div><div class="row"><span>TIPO</span><b>'+p.Tipo+'</b></div><div class="row"><span>LUGAR</span><b>'+p['Lugar / evento']+'</b></div>';
 if(r&&r['Anécdota / recuerdo'])h+='<div class="story">'+r['Anécdota / recuerdo']+'</div>';
 h+='<div class="muted">CONEXIONES</div>';
 con.forEach(c=>{const other=String(c['ID A'])===String(id)?c['Persona B']:c['Persona A'];const t=String(c['Gracias a Samu']).startsWith('Sí');h+='<div class="row"><span>'+other+'</span><b style="color:'+(t?'#28a7ff':'#666')+'">'+(t?'GRACIAS A SAMU':'YA SE CONOCÍAN')+'</b></div>'});
 document.getElementById('content').innerHTML=h;document.getElementById('panel').classList.add('open');
}
document.getElementById('close').addEventListener('click',()=>{document.getElementById('panel').classList.remove('open');clearSelection();});
applyTransform();
</script></body></html>
