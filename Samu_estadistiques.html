<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samu — Estadístiques</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070707;color:#f1f1ed;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}
.nav{height:72px;border-bottom:1px solid #202020;display:flex;align-items:center;padding:0 28px;position:sticky;top:0;background:rgba(7,7,7,.97);z-index:10}.brand{font-size:13px;font-weight:700;letter-spacing:3px}.brand small{color:#555;font-weight:400;letter-spacing:1px;margin-left:7px}.nav-right{margin-left:auto}.nav-btn,.info-btn{border:1px solid #292929;background:#0b0b0b;color:#aaa;cursor:pointer}.nav-btn{padding:10px 14px;font-size:10px;letter-spacing:1.5px}
main{max-width:1280px;margin:auto;padding:70px 6vw 110px}.kicker,.section-num{color:#555;font-size:10px;letter-spacing:3px}h1{font-size:clamp(52px,8vw,104px);line-height:.86;letter-spacing:-6px;margin:18px 0 70px;font-weight:600}h1 em{color:#777;font-weight:400}.intro{max-width:680px;color:#888;font-size:15px;line-height:1.7;margin-top:-42px;margin-bottom:65px}
.hero{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #252525;border-bottom:1px solid #252525;margin-bottom:70px}.metric{padding:26px 20px 25px 0;border-right:1px solid #222}.metric:last-child{border:0}.metric b{font-size:42px;letter-spacing:-2px}.metric span{display:block;color:#666;font-size:9px;letter-spacing:1.5px;margin-top:10px}
.section{margin:85px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}h2{font-size:30px;letter-spacing:-1px;margin:7px 0 0}.desc{color:#666;font-size:11px;max-width:420px;line-height:1.5}.info-btn{width:21px;height:21px;border-radius:50%;margin-left:8px;font-weight:700}
.card{border:1px solid #232323;background:#0a0a0a;padding:26px}.type-wrap{display:grid;grid-template-columns:330px 1fr;gap:40px;align-items:center}.donut{width:270px;height:270px;border-radius:50%;margin:auto;position:relative}.donut:after{content:"";position:absolute;inset:54px;background:#0a0a0a;border-radius:50%}.donut-center{position:absolute;z-index:2;inset:0;display:grid;place-items:center;text-align:center;font-size:33px;font-weight:600}.donut-center small{display:block;color:#666;font-size:8px;letter-spacing:2px;font-weight:400}
.type-list{display:flex;flex-direction:column;gap:10px}.type-row{display:grid;grid-template-columns:140px 1fr 70px;align-items:center;gap:12px;font-size:10px;color:#aaa}.track{height:4px;background:#1b1b1b}.track i{display:block;height:100%;animation:grow 1s both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bridge-list{display:flex;flex-direction:column}.bridge-row{display:grid;grid-template-columns:36px 1fr 180px 80px;gap:12px;align-items:center;border-bottom:1px solid #191919;padding:14px 0;font-size:11px}.bar{height:4px;background:#242424}.bar i{display:block;height:100%;background:#f1f1ed}.timeline{display:flex;align-items:flex-end;height:250px;gap:14px;border-bottom:1px solid #222;padding:0 10px}.year{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;height:100%;justify-content:flex-end;min-width:45px}.bar-y{width:100%;max-width:60px;background:#f1f1ed;min-height:4px;animation:up .8s both;transform-origin:bottom}@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}.year span{font-size:9px;color:#666;white-space:nowrap}
.matrix-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px;font-size:9px}th,td{border:1px solid #1d1d1d;padding:9px;text-align:center}th{color:#666;font-weight:500}td{color:#aaa}.diag{color:#333;background:#0d0d0d}
.story{display:grid;grid-template-columns:1fr 1fr;min-height:300px}.copy{padding:10px 35px 10px 0}.quote{font-size:31px;line-height:1.05;letter-spacing:-1px;margin:18px 0 25px}.small{color:#777;font-size:11px;line-height:1.7}.art{display:flex;justify-content:center;align-items:center}.art svg{width:100%;max-height:300px}.footer{border-top:1px solid #222;padding-top:25px;color:#444;font-size:9px;letter-spacing:1px}
.info-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:25px}.info-modal.open{display:flex}.info-box{width:min(560px,94vw);background:#0d0d0d;border:1px solid #333;padding:32px;position:relative}.info-box .x{position:absolute;right:14px;top:10px;border:0;background:none;color:#777;font-size:25px}.info-box .tag{color:#555;font-size:9px;letter-spacing:2.5px}.info-box h3{font-size:25px;margin:12px 30px 16px 0}.info-box p{color:#999;font-size:13px;line-height:1.7;margin:0}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#070707;z-index:100;color:#777;font-size:12px;letter-spacing:1px}
@media(max-width:850px){main{padding:45px 20px 80px}h1{letter-spacing:-3px}.hero{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.type-wrap,.story{grid-template-columns:1fr}.donut{width:210px;height:210px}.donut:after{inset:43px}.bridge-row{grid-template-columns:28px 1fr 90px 65px}}
</style>
</head>
<body>
<div id="loading" class="loading">ANALITZANT EL TEU EXCEL…</div>
<header class="nav"><div class="brand">SAMU <small>/ MAPA SOCIAL</small></div><div class="nav-right"><button class="nav-btn" id="back">← MAPA</button></div></header>
<main id="main" style="display:none"></main>
<div class="info-modal" id="infoModal"><div class="info-box"><button class="x" id="infoClose">×</button><div class="tag" id="infoTag"></div><h3 id="infoTitle"></h3><p id="infoDesc"></p></div></div>

<script>
const DATA_URL="data.xlsx";
const palette=["#c9a7ff","#f2c66d","#70d9b0","#ff7777","#ff9b67","#75a9ff","#f178ba","#9adf68","#65cbe8","#c8a27a","#e4df73","#aa8ee8","#b8b8b8"];
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function sid(v){if(v===null||v===undefined)return "";let s=String(v).trim();return /^\d+\.0$/.test(s)?s.split(".")[0]:s}
function displayName(full){const p=String(full||"").trim().split(/\s+/);if(p.length<=1)return p[0]||"";let surname=p[p.length-1];return `${p[0]} ${surname[0].toUpperCase()}.`}

async function load(){
 const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw new Error("No s'ha pogut carregar data.xlsx");
 const wb=XLSX.read(await res.arrayBuffer(),{type:"array"});
 const sheet=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:""}):[];
 const people=sheet("PERSONAS"), conns=sheet("CONEXIONES"), refs=sheet("REFERENCIAS");
 if(!people.length||!conns.length)throw new Error("Falten les fulles PERSONAS o CONEXIONES.");
 return {people,conns,refs};
}
function build(d){
 const pby=new Map(d.people.map(p=>[sid(p.ID),p])),deg=new Map(d.people.map(p=>[sid(p.ID),0]));
 const nameToId=new Map(d.people.map(p=>[String(p.Nombre||"").trim(),sid(p.ID)]));
 const edges=[];
 function resolve(name,id){const i=sid(id);if(i&&pby.has(i))return i;const n=String(name||"").trim();return nameToId.get(n)||null}
 d.conns.forEach(c=>{const a=resolve(c["Persona A"],c["ID A"]),b=resolve(c["Persona B"],c["ID B"]);if(a&&b&&a!==b){edges.push({a,b,thanks:String(c["Gracias a Samu"]||"").toLowerCase().startsWith("sí")});deg.set(a,(deg.get(a)||0)+1);deg.set(b,(deg.get(b)||0)+1)}});
 const types=[...new Set(d.people.map(p=>String(p.Tipo||"Sense tipologia")))],years={},typeCounts={};d.people.forEach(p=>{const t=String(p.Tipo||"Sense tipologia");typeCounts[t]=(typeCounts[t]||0)+1;const y=String(p["Fecha aprox."]||"Sense data");years[y]=(years[y]||0)+1});
 const matrix={};types.forEach(t=>matrix[t]={});types.forEach(a=>types.forEach(b=>matrix[a][b]=0));edges.forEach(e=>{const ta=String(pby.get(e.a).Tipo||"Sense tipologia"),tb=String(pby.get(e.b).Tipo||"Sense tipologia");matrix[ta][tb]++;matrix[tb][ta]++});
 const ranked=d.people.map(p=>({name:p.Nombre,id:sid(p.ID),degree:deg.get(sid(p.ID))||0})).sort((a,b)=>b.degree-a.degree||a.name.localeCompare(b.name));
 return {pby,edges,types,years,typeCounts,matrix,ranked};
}
function typeColor(t,types){return palette[types.indexOf(t)%palette.length]||"#777"}

function render(g){
 const total=g.pby.size,thanks=g.edges.filter(e=>e.thanks).length,top=g.ranked[0];
 const typeEntries=Object.entries(g.typeCounts).sort((a,b)=>b[1]-a[1]);let cur=0;const stops=typeEntries.map(([t,n],i)=>{const a=cur/total*100;cur+=n;const b=cur/total*100;return `${typeColor(t,g.types)} ${a}% ${b}%`}).join(",");
 const typeRows=typeEntries.map(([t,n])=>`<div class="type-row"><span>${esc(t)}</span><div class="track"><i style="width:${n/total*100}%;background:${typeColor(t,g.types)}"></i></div><b>${n} · ${Math.round(n/total*100)}%</b></div>`).join("");
 const maxD=Math.max(1,...g.ranked.map(x=>x.degree));
 const bridge=g.ranked.slice(0,10).map((x,i)=>`<div class="bridge-row"><span>${String(i+1).padStart(2,"0")}</span><strong>${esc(displayName(x.name))}</strong><div class="bar"><i style="width:${x.degree/maxD*100}%"></i></div><span>${x.degree} vincles</span></div>`).join("");
 const maxY=Math.max(...Object.values(g.years),1);
 const timeline=Object.entries(g.years).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([y,n])=>`<div class="year"><div class="bar-y" style="height:${Math.max(8,n/maxY*180)}px"></div><b>${n}</b><span>${esc(y)}</span></div>`).join("");
 const matrixHead="<tr><th></th>"+g.types.map(t=>`<th>${esc(t)}</th>`).join("")+"</tr>";
 const matrixRows=g.types.map(a=>`<tr><th>${esc(a)}</th>`+g.types.map(b=>`<td class="${a===b?"diag":""}">${a===b?"—":g.matrix[a][b]}</td>`).join("")+"</tr>`).join("");
 const extra=(2*g.edges.length/Math.max(total,1)).toFixed(1);

 document.getElementById("main").innerHTML=`
 <div class="kicker">SAMU / ANÀLISI DE LA TEVA XARXA</div><h1>L’arquitectura<br><em>de les teves connexions.</em></h1>
 <p class="intro">Aquesta pàgina es genera cada vegada que obres l’HTML a partir de <b>data.xlsx</b>. Si canvies l’Excel al repositori, les dades del mapa i d’aquesta pàgina canvien automàticament.</p>
 <div class="hero"><div class="metric"><b>${total}</b><span>PERSONES REGISTRADES</span></div><div class="metric"><b>${g.edges.length}</b><span>CONNEXIONS</span></div><div class="metric"><b>${thanks}</b><span>CONNEXIONS «GRÀCIES A TU»</span></div><div class="metric"><b>${g.types.length}</b><span>TIPOLOGIES</span></div></div>

 <section class="section"><div class="head"><div><div class="section-num">01 / EL TEU UNIVERS</div><h2>D’on ve la teva gent?<button class="info-btn" data-title="01 / EL TEU UNIVERS" data-desc="Cada persona es classifica segons la columna Tipo del full PERSONAS. El percentatge és el nombre de persones de cada tipologia dividit entre el total de persones registrades.">i</button></h2></div><div class="desc">Distribució real de les dades de PERSONAS.</div></div><div class="card type-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center">${total}<small>PERSONES</small></div></div><div class="type-list">${typeRows}</div></div></section>

 <section class="section"><div class="head"><div><div class="section-num">02 / ELS NEXES</div><h2>Qui connecta més mons?<button class="info-btn" data-title="02 / ELS NEXES" data-desc="Es compten directament les connexions de CONEXIONES per persona. No és una mètrica inventada de centralitat: és un rànquing de vincles directes que surten de l’Excel.">i</button></h2></div><div class="desc">Qui té més connexions directes dins de les dades.</div></div><div class="card bridge-list">${bridge}</div></section>

 <section class="section"><div class="head"><div><div class="section-num">03 / L’EVOLUCIÓ</div><h2>Com ha crescut la teva xarxa?<button class="info-btn" data-title="03 / L’EVOLUCIÓ" data-desc="Cada persona es col·loca en l’any que apareix a Fecha aprox. Les barres no estimen res: només agrupen els valors que hi ha a l’Excel.">i</button></h2></div><div class="desc">Persones agrupades per l’any registrat.</div></div><div class="card"><div class="timeline">${timeline}</div></div></section>

 <section class="section"><div class="head"><div><div class="section-num">04 / MONS QUE ES BARREGEN</div><h2>Quins cercles es creuen?<button class="info-btn" data-title="04 / MONS QUE ES BARREGEN" data-desc="La matriu compta connexions reals entre tipologies del full PERSONAS. No s’hi afegeixen categories que no existeixin a l’Excel.">i</button></h2></div><div class="desc">Connexions entre tipologies segons el teu Excel.</div></div><div class="card matrix-wrap"><table>${matrixHead}${matrixRows}</table></div></section>

 <section class="section"><div class="head"><div><div class="section-num">05 / EL PONT</div><h2>Cada persona que has conegut pot obrir-te un món nou.<button class="info-btn" data-title="05 / EL PONT" data-desc="Aquesta lectura resumeix la mateixa xarxa des d’un punt de vista més narratiu. Les xifres continuen sortint exclusivament de PERSONAS i CONEXIONES.">i</button></h2></div></div><div class="card story"><div class="copy"><div class="section-num">UNA LECTURA DE LA TEVA XARXA</div><div class="quote">“Cada persona que has conegut no és només una amistat: és una porta a altres persones, altres grups i altres històries.”</div><div class="small">Ara mateix tens <b>${total} persones</b> registrades i <b>${g.edges.length} connexions</b>. Això equival a una mitjana de <b>${extra} connexions per persona</b> si repartim tots els vincles entre les persones registrades.<br><br>${top?`La persona amb més connexions directes en les dades actuals és <b>${esc(displayName(top.name))}</b>, amb <b>${top.degree} vincles</b>.`:""}<br><br>Tot això es recalcula automàticament a partir de <b>data.xlsx</b>.</div></div><div class="art"><svg viewBox="0 0 500 300"><circle cx="250" cy="150" r="31" fill="#f1f1ed"/><text x="250" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#050505">TU</text><g fill="none" stroke="#666" stroke-width="1.3" opacity=".7"><circle cx="105" cy="80" r="50"/><circle cx="390" cy="78" r="52"/><circle cx="95" cy="230" r="45"/><circle cx="395" cy="225" r="48"/><line x1="145" y1="101" x2="220" y2="135"/><line x1="355" y1="101" x2="280" y2="135"/><line x1="140" y1="205" x2="220" y2="166"/><line x1="360" y1="200" x2="280" y2="166"/></g><circle cx="145" cy="101" r="5" fill="#c9a7ff"/><circle cx="355" cy="101" r="5" fill="#70d9b0"/><circle cx="140" cy="205" r="5" fill="#ff9b67"/><circle cx="360" cy="200" r="5" fill="#65cbe8"/></svg></div></div></section>
 <div class="footer">LES DADES ES GENEREN EN TEMPS REAL DES DE data.xlsx · ${total} PERSONES · ${g.edges.length} CONNEXIONS</div>`;
 document.getElementById("main").style.display="block";document.getElementById("loading").remove();
 document.querySelectorAll(".info-btn").forEach(b=>b.onclick=()=>{document.getElementById("infoTag").textContent=b.dataset.title;document.getElementById("infoTitle").textContent=b.closest(".head").querySelector("h2").childNodes[0].textContent.trim();document.getElementById("infoDesc").textContent=b.dataset.desc;document.getElementById("infoModal").classList.add("open")});
}
document.getElementById("back").onclick=()=>location.href="Samu_mapa_interactivo.html";
document.getElementById("infoClose").onclick=()=>document.getElementById("infoModal").classList.remove("open");
document.getElementById("infoModal").onclick=e=>{if(e.target.id==="infoModal")document.getElementById("infoModal").classList.remove("open")};
(async()=>{try{const d=await load();render(build(d))}catch(e){document.getElementById("loading").innerHTML=`<div>No s'ha pogut carregar <b>data.xlsx</b>.<br><br>${esc(e.message)}<br><br>Assegura't que està al mateix repositori que aquest HTML.</div>`}})();
</script>
</body>
</html>
